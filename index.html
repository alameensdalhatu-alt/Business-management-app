<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f6b4f">

  <title>Business Management App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="container">

      <h1 id="appTitle">Business Management App</h1>

      <p id="subtitle">
        Simple management for MSMEs
      </p>

      <button
        class="language-button"
        onclick="toggleLanguage()">
        Hausa / English
      </button>

    </div>
  </header>


  <main class="container">

    <!-- Business Profile -->
    <section class="business-box">

      <h2 id="businessTitle">
        Your Business
      </h2>

      <input
        id="businessName"
        type="text"
        placeholder="Enter your business name"
      >

      <button
        onclick="saveBusinessName()">
        Save Business
      </button>

    </section>


    <!-- Dashboard -->
    <h2 class="section-title" id="dashboardTitle">
      Dashboard
    </h2>

    <section class="dashboard">

      <div class="card">
        <small id="salesLabel">Sales</small>
        <strong id="salesValue">₦0</strong>
      </div>

      <div class="card">
        <small id="expenseLabel">Expenses</small>
        <strong id="expenseValue">₦0</strong>
      </div>

      <div class="card">
        <small id="receivableLabel">
          Receivables
        </small>
        <strong id="receivableValue">₦0</strong>
      </div>

      <div class="card">
        <small id="payableLabel">
          Payables
        </small>
        <strong id="payableValue">₦0</strong>
      </div>

    </section>


    <!-- Modules -->
    <h2 class="section-title" id="modulesTitle">
      Business Modules
    </h2>

    <section class="modules">

      <button
        class="module"
        onclick="openModule('Sales')">

        <span>💰</span>
        <b id="salesModule">Sales</b>

      </button>


      <button
        class="module"
        onclick="openModule('Expenses')">

        <span>💸</span>
        <b id="expensesModule">Expenses</b>

      </button>


      <button
        class="module"
        onclick="openModule('Inventory')">

        <span>📦</span>
        <b id="inventoryModule">Inventory</b>

      </button>


      <button
        class="module"
        onclick="openModule('Customers')">

        <span>👥</span>
        <b id="customersModule">Customers</b>

      </button>


      <button
        class="module"
        onclick="openModule('Suppliers')">

        <span>🤝</span>
        <b id="suppliersModule">Suppliers</b>

      </button>


      <button
        class="module"
        onclick="openModule('Invoices')">

        <span>🧾</span>
        <b id="invoicesModule">Invoices</b>

      </button>


      <button
        class="module"
        onclick="openModule('Meetings')">

        <span>📅</span>
        <b id="meetingsModule">Meetings</b>

      </button>


      <button
        class="module"
        onclick="openModule('Reports')">

        <span>📊</span>
        <b id="reportsModule">Reports</b>

      </button>

    </section>

  </main>


  <footer>
    Business Management App • MSME Edition
  </footer>


  <!-- Main JavaScript -->
  <script src="app.js"></script>

</body>
</html>
